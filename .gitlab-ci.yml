stages:
  - test


default:
  image: node:lts-bookworm-slim
  cache:  # Cache modules in between jobs
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .npm/

lint:
  stage: test
  image: node
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🚩 You can fix lint errors by running 'npx prettier --write .' and  'npx eslint --fix .'"
    - npm run lint 
  allow_failure: false
